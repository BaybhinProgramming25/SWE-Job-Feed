services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      WWW_ADDRESS: ${WWW_ADDRESS:-http://www.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure --cache=256MiB --max-sql-memory=256MiB
    restart: unless-stopped
    oom_score_adj: -600
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:8081:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1200m

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400m

  backend:
    build: ./backend
    restart: unless-stopped
    oom_score_adj: 200
    environment:
      DB_HOST: cockroachdb
      RABBITMQ_HOST: rabbitmq
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    depends_on:
      cockroachdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64m

  scheduler:
    build: ./scheduler
    restart: unless-stopped
    oom_score_adj: 200
    environment:
      DB_HOST: cockroachdb
      RABBITMQ_HOST: rabbitmq
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      POLL_MINUTES: ${POLL_MINUTES:-30}
    depends_on:
      cockroachdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500m

  worker:
    build: ./worker
    restart: unless-stopped
    oom_score_adj: 200
    environment:
      DB_HOST: cockroachdb
      RABBITMQ_HOST: rabbitmq
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    depends_on:
      cockroachdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 400m

volumes:
  cockroach-data:
  caddy-data:
  caddy-config:
