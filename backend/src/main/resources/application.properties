spring.application.name=backend
server.port=7000

# Surface ResponseStatusException reasons to the client (e.g. "set ANTHROPIC_API_KEY").
server.error.include-message=always

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:26257/dist_jobs_scheduler?sslmode=disable
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
app.jwt.secret=${APP_JWT_SECRET}

# Browser origin allowed for CORS and the WebSocket handshake.
# Locally this is the Vite/nginx dev origin; in production set
# APP_ALLOWED_ORIGIN=https://yourdomain.com
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:3000}